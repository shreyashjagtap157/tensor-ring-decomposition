name: Tests

on:
  push:
    branches: [main, improvements-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests
      run: |
        python -m pytest -q --timeout=120 -k "not huggingface and not enterprise and not quality_embedding and not test_benchmark" --ignore=tests/test_huggingface.py --ignore=tests/test_enterprise.py
