name: HF Embedding Compression Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model name (e.g., gpt2, bert-base-uncased)"
        required: true
        default: "gpt2"
      ranks:
        description: "Comma-separated ranks"
        required: false
        default: "4,8,16,24,32,48"

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: 1
  PYTHONUNBUFFERED: 1

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout -b main ${{ github.sha }}
        name: Checkout repo

      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers huggingface_hub safetensors
          pip install -e .
        name: Install deps

      - run: |
          python benchmark_hf.py "${{ inputs.model }}" \
            --ranks "${{ inputs.ranks }}" \
            --output results.json
        name: Run benchmark

      - run: |
          echo '## Embedding Compression Benchmark' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
          print(f'Model: {d[\"model\"]}  ({d[\"vocab_size\"]}x{d[\"embedding_dim\"]})')
          print(f'Dense params: {d[\"dense_parameters\"]:,}')
          print()
          print(f'{\"Rank\":>6} | {\"Compression\":>11} | {\"Params\":>10} | {\"ReconErr\":>8} | {\"EOS@10\":>7}')
          print(f'{\"-\"*6}-+-{\"-\"*11}-+-{\"-\"*10}-+-{\"-\"*8}-+-{\"-\"*7}')
          for r in d['results']:
              print(f\"{r['rank']:>6} | x{r['compression_ratio']:>7.1f}{'':>5} | {r['num_parameters']:>10,} | {r['reconstruction_error_pct']:>6.1f}% | {r['eigenspace_overlap_k10']:>7.4f}\")
          "
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Results saved as artifact: results.json" >> $GITHUB_STEP_SUMMARY
        name: Summary

      - run: cat results.json
        name: Print raw results
