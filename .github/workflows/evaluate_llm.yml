name: LLM Perplexity Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF causal LM name (e.g., gpt2, facebook/opt-125m)"
        required: true
        type: string
        default: "gpt2"
      rank:
        description: "TR rank"
        required: false
        type: string
        default: "8"

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: 1
  PYTHONUNBUFFERED: 1

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers huggingface_hub safetensors
          pip install -e .

      - name: Run evaluation
        id: eval
        run: |
          python evaluate_llm.py "${{ inputs.model }}" \
            --rank ${{ inputs.rank }} \
            --output results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-results
          path: results.json

      - name: Summary
        run: |
          echo '## LLM Perplexity Evaluation' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
          print(f'Model: {d[\"model\"]} @ rank={d[\"rank\"]}')
          print(f'Params: {d[\"dense_parameters\"]:,} -> {d[\"tr_parameters\"]:,} ({d[\"compression_ratio\"]}x)')
          print(f'Perplexity: {d[\"baseline_perplexity\"]} -> {d[\"compressed_perplexity\"]} ({d[\"perplexity_change_pct\"]:+.2f}%)')
          print(f'Recon error: {d[\"reconstruction_error_pct\"]}%')
          "
          echo '```' >> $GITHUB_STEP_SUMMARY
