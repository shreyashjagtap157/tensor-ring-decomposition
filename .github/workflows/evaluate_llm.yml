name: LLM Perplexity Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF causal LM name (e.g., gpt2, facebook/opt-125m)"
        required: true
        default: "gpt2"
      rank:
        description: "TR rank"
        required: false
        default: "8"
      hf_token:
        description: "Your HF token (for gated models like Gemma/Llama). Leave blank to use repo secret."
        required: false
        default: ""

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: 1
  PYTHONUNBUFFERED: 1

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout -b main ${{ github.sha }}
        name: Checkout repo

      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers huggingface_hub safetensors
          pip install -e .
        name: Install deps

      - name: Set HF token (for gated models like Gemma/Llama)
        run: |
          TOKEN="${{ inputs.hf_token }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.HF_TOKEN }}"
          fi
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "HF_TOKEN=$TOKEN" >> $GITHUB_ENV
          fi

      - run: |
          python evaluate_llm.py "${{ inputs.model }}" \
            --rank ${{ inputs.rank }} \
            --output results.json
        name: Run evaluation

      - run: |
          echo '## LLM Perplexity Evaluation' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
          print(f'Model: {d[\"model\"]} @ rank={d[\"rank\"]}')
          print(f'Params: {d[\"dense_parameters\"]:,} -> {d[\"tr_parameters\"]:,} ({d[\"compression_ratio\"]}x)')
          pct = d['perplexity_change_pct']
          print(f'Perplexity: {d[\"baseline_perplexity\"]} -> {d[\"compressed_perplexity\"]} ({pct:+.2f}%)')
          print(f'Recon error: {d[\"reconstruction_error_pct\"]}%')
          "
          echo '```' >> $GITHUB_STEP_SUMMARY
        name: Summary
