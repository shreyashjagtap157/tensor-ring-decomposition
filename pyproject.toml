[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-ring-decomposition"
version = "0.3.0"
description = "Tensor Ring Decomposition for Embedding compression — drop-in replacement for nn.Embedding with 10-100x parameter reduction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "opt_einsum>=3.3",
    "safetensors>=0.4",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/shreyashjagtap157/tensor-ring-decomposition"
Repository = "https://github.com/shreyashjagtap157/tensor-ring-decomposition"
Documentation = "https://github.com/shreyashjagtap157/tensor-ring-decomposition#readme"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
hf = [
    "transformers>=4.30",
]
gguf = [
    "gguf>=0.6",
]
docs = [
    "sphinx>=7.2",
    "sphinx_rtd_theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]
all = [
    "tensor-ring-decomposition[dev,hf,gguf,docs]",
]

[tool.setuptools.packages.find]
include = ["tensor_ring_decomposition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.package-data]
"tensor_ring_decomposition" = ["py.typed"]
